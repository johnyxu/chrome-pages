<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Tab Saver — Saved Links</title>
  <link rel="stylesheet" href="manager.css" />
</head>
<body>
  <div class="page-layout">
    <div class="sidebar-column">
      <aside id="favorites-sidebar" class="sidebar-box favorites-sidebar" hidden>
        <h2 class="sidebar-box-title">★ Favorites</h2>
        <div id="favorites-list" class="favorites-list"></div>
      </aside>
      <aside id="domain-filter-sidebar" class="sidebar-box domain-filter-sidebar" hidden>
        <h2 class="sidebar-box-title">🌐 Filter by Domain</h2>
        <div id="domain-filter-list" class="domain-filter-list"></div>
      </aside>
      <aside id="recent-days-sidebar" class="sidebar-box recent-days-sidebar" hidden>
        <h2 class="sidebar-box-title">🕓 Recent 7 Days</h2>
        <div id="recent-days-list" class="recent-days-list"></div>
      </aside>
    </div>
    <main class="main-content">
      <header class="page-header">
        <div>
          <h1>Saved Links</h1>
          <p class="subtitle" id="link-count"></p>
        </div>
        <div class="header-actions">
          <div class="view-toggle" role="group" aria-label="View mode">
            <button id="view-list-btn" class="view-toggle-btn" type="button" aria-pressed="true">☰ List</button>
            <button id="view-card-btn" class="view-toggle-btn" type="button" aria-pressed="false">▦ Cards</button>
            <button id="view-least-viewed-btn" class="view-toggle-btn" type="button" aria-pressed="false">🕓 Least Viewed</button>
          </div>
          <button id="reconnect-btn" class="btn btn-secondary" hidden>Connect a different file</button>
        </div>
      </header>
      <div id="error" class="banner" hidden></div>
      <div id="connect-section" class="empty-state">
        <p id="connect-message">No file connected yet.</p>
        <div class="empty-state-actions">
          <button id="grant-btn" class="btn btn-primary" hidden>Grant access</button>
          <button id="connect-btn" class="btn btn-primary">Connect a file</button>
        </div>
      </div>
      <div id="list-section" hidden>
        <input id="search-input" class="search-input" type="search" placeholder="Search by title or URL…" />
        <div id="link-list" class="link-groups"></div>
      </div>
    </main>
  </div>
  <script type="module" src="manager.js"></script>
</body>
</html>
