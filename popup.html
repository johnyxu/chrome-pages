<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Tab Saver</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup">
    <div class="popup-header">
      <span class="popup-title">Tab Saver</span>
      <button id="settings-btn" class="icon-btn" type="button" aria-label="Settings" title="Settings">⚙</button>
    </div>
    <div id="settings-panel" class="settings-panel" hidden>
      <label class="settings-row">
        <input type="checkbox" id="close-tab-toggle" />
        Close tab after saving
      </label>
    </div>
    <button id="save-all-btn">Save All Tabs</button>
    <button id="save-current-btn">Save Current Tab</button>
    <p id="status"></p>
    <a href="#" id="manage-link">View saved links</a>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
